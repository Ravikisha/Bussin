<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="t d" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"><title id="t">How bussin works</title><desc id="d">Mine text, measure its register, prefix each document with register tokens, train p(text|register), then set the prefix to steer generation</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c5cff"/></marker></defs><rect x="1" y="1" width="1198" height="488" rx="18" fill="#fcfcfb" stroke="#e4e3de" stroke-width="2"/><text x="46" y="38" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" >How it works</text><rect x="36" y="52" width="196" height="132" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="36" y="52" width="196" height="8" rx="4" fill="url(#g)"/><text x="54" y="96" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >1  Mine</text><text x="54" y="130" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >Community text, plus a</text><text x="54" y="150" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >date-stamped slang lexicon</text><line x1="238" y1="118.0" x2="258" y2="118.0" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#ar)"/><rect x="264" y="52" width="196" height="132" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="264" y="52" width="196" height="8" rx="4" fill="url(#g)"/><text x="282" y="96" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >2  Measure</text><text x="282" y="130" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >A deterministic annotator</text><text x="282" y="150" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >scores five dimensions</text><line x1="466" y1="118.0" x2="486" y2="118.0" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#ar)"/><rect x="492" y="52" width="196" height="132" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="492" y="52" width="196" height="8" rx="4" fill="url(#g)"/><text x="510" y="96" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >3  Prefix</text><text x="510" y="130" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >Register tokens are put in</text><text x="510" y="150" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >front of every document</text><line x1="694" y1="118.0" x2="714" y2="118.0" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#ar)"/><rect x="720" y="52" width="196" height="132" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="720" y="52" width="196" height="8" rx="4" fill="url(#g)"/><text x="738" y="96" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >4  Train</text><text x="738" y="130" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >A 125M decoder learns</text><text x="738" y="150" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >p(text | register)</text><line x1="922" y1="118.0" x2="942" y2="118.0" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#ar)"/><rect x="948" y="52" width="196" height="132" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="948" y="52" width="196" height="8" rx="4" fill="url(#g)"/><text x="966" y="96" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >5  Dial</text><text x="966" y="130" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >Write a prefix at inference;</text><text x="966" y="150" font-size="14" fill="#52514e" font-weight="400" text-anchor="start" >it continues in that register</text><text x="46" y="262" font-size="17" fill="#52514e" font-weight="600" text-anchor="start" >What one training document looks like</text><rect x="46" y="280" width="135" height="34" rx="8" fill="#efeefb" stroke="#cfc9f6"/><text x="113.435" y="302.5" font-size="14.5" fill="#3b2fa0" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|endoftext|&gt;</text><rect x="189" y="280" width="81" height="34" rx="8" fill="#efeefb" stroke="#cfc9f6"/><text x="229.335" y="302.5" font-size="14.5" fill="#3b2fa0" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|reg|&gt;</text><rect x="278" y="280" width="117" height="34" rx="8" fill="#fde9f1" stroke="#f6bcd3"/><text x="336.245" y="302.5" font-size="14.5" fill="#a3245a" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|slang_3|&gt;</text><rect x="403" y="280" width="117" height="34" rx="8" fill="#fde9f1" stroke="#f6bcd3"/><text x="461.135" y="302.5" font-size="14.5" fill="#a3245a" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|emoji_1|&gt;</text><rect x="528" y="280" width="126" height="34" rx="8" fill="#fde9f1" stroke="#f6bcd3"/><text x="590.52" y="302.5" font-size="14.5" fill="#a3245a" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|abbrev_2|&gt;</text><rect x="661" y="280" width="117" height="34" rx="8" fill="#fde9f1" stroke="#f6bcd3"/><text x="719.9050000000001" y="302.5" font-size="14.5" fill="#a3245a" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|elong_0|&gt;</text><rect x="786" y="280" width="126" height="34" rx="8" fill="#fde9f1" stroke="#f6bcd3"/><text x="849.29" y="302.5" font-size="14.5" fill="#a3245a" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|formal_0|&gt;</text><rect x="920" y="280" width="90" height="34" rx="8" fill="#efeefb" stroke="#cfc9f6"/><text x="965.19" y="302.5" font-size="14.5" fill="#3b2fa0" font-weight="600" text-anchor="middle" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >&lt;|/reg|&gt;</text><text x="46" y="348" font-size="16.5" fill="#0b0b0b" font-weight="500" text-anchor="start" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >...then the text itself:   lowkey that movie was so good ngl</text><text x="46" y="392" font-size="15" fill="#52514e" font-weight="500" text-anchor="start" font-family="'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" >five measured levels:   slang 0-4   emoji 0-3   abbrev 0-3   elong 0-2   formal 0-3</text><rect x="46" y="414" width="1108" height="48" rx="12" fill="#f6f4ff" stroke="#e1dcfb"/><text x="66" y="444" font-size="15.5" fill="#0b0b0b" font-weight="500" text-anchor="start" >&quot;Cringe&quot; is register mismatch, not slang. Condition on the register and you can measure the mismatch (Register Calibration Error) and drive it down.</text></svg>