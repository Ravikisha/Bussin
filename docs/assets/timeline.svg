<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"><title id="t">Project timeline</title><desc id="d">From the first run, through the double-shift bug and its fix, to the released model</desc><rect x="1" y="1" width="1198" height="328" rx="18" fill="#fcfcfb" stroke="#e4e3de" stroke-width="2"/><text x="46" y="38" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" >What happened, kept in the record</text><line x1="90" y1="120" x2="1110" y2="120" stroke="#d9d6ee" stroke-width="4" stroke-linecap="round"/><circle cx="90" cy="120" r="14" fill="#eb6834" stroke="#fcfcfb" stroke-width="3"/><text x="90.0" y="172" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >v1 run</text><text x="90.0" y="196" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >6.74B tokens,</text><text x="90.0" y="215" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >~110 GPU-hours</text><circle cx="260" cy="120" r="14" fill="#eb6834" stroke="#fcfcfb" stroke-width="3"/><text x="260.0" y="172" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Eval looks wrong</text><text x="260.0" y="196" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >next-token NLL 8.76</text><text x="260.0" y="215" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >vs 5.40 at +2</text><circle cx="430" cy="120" r="14" fill="#eb6834" stroke="#fcfcfb" stroke-width="3"/><text x="430.0" y="172" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Root cause</text><text x="430.0" y="196" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >loss shifted targets</text><text x="430.0" y="215" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >a second time</text><circle cx="600" cy="120" r="14" fill="#1baf7a" stroke="#fcfcfb" stroke-width="3"/><text x="600.0" y="172" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Fix + test</text><text x="600.0" y="196" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >objective_test fails</text><text x="600.0" y="215" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >old loss, passes fix</text><circle cx="770" cy="120" r="14" fill="#1baf7a" stroke="#fcfcfb" stroke-width="3"/><text x="770.0" y="172" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Realign run</text><text x="770.0" y="196" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >4,067 steps,</text><text x="770.0" y="215" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >1.07B tokens</text><circle cx="940" cy="120" r="14" fill="#2a78d6" stroke="#fcfcfb" stroke-width="3"/><text x="940.0" y="172" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Measure</text><text x="940.0" y="196" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >register error 0.15</text><text x="940.0" y="215" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >vs 0.65 null</text><circle cx="1110" cy="120" r="14" fill="#2a78d6" stroke="#fcfcfb" stroke-width="3"/><text x="1110.0" y="172" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Ship</text><text x="1110.0" y="196" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >Llama export,</text><text x="1110.0" y="215" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="middle" >logit parity checked</text><text x="46" y="290" font-size="15" fill="#52514e" font-weight="500" text-anchor="start" >The first run optimised the wrong objective. It was found by looking at the evaluation, fixed at the loss, and locked in by a test that fails on the old code.</text></svg>