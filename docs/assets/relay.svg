<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"><title id="t">Relay and orchestration</title><desc id="d">Kaggle sessions hand training over through checkpoints and a lease stored on the Hugging Face Hub; a stateless orchestrator starts sessions</desc><defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c5cff"/></marker></defs><rect x="1" y="1" width="1198" height="428" rx="18" fill="#fcfcfb" stroke="#e4e3de" stroke-width="2"/><text x="46" y="38" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start" >Training on free GPUs without losing progress</text><rect x="46" y="70" width="300" height="120" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="46" y="70" width="8" height="120" rx="4" fill="#1baf7a"/><text x="72" y="106" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start" >Kaggle session N</text><text x="72" y="134" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >2 x T4, up to 12 h</text><text x="72" y="156" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >holds the lease, trains,</text><text x="72" y="178" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >checkpoints every ~50 min</text><rect x="46" y="250" width="300" height="120" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="46" y="250" width="8" height="120" rx="4" fill="#2a78d6"/><text x="72" y="286" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start" >Kaggle session N+1</text><text x="72" y="314" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >starts after N ends or dies</text><text x="72" y="336" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >claims the expired lease,</text><text x="72" y="358" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >resumes bit-exact</text><rect x="450" y="130" width="330" height="170" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="450" y="130" width="8" height="170" rx="4" fill="#7c5cff"/><text x="476" y="166" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start" >Hugging Face Hub</text><text x="476" y="194" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >checkpoint: weights, optimizer,</text><text x="476" y="216" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >scheduler, RNG, data cursor, hash</text><text x="476" y="238" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >RUN_STATE.json = the lease</text><text x="476" y="260" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >claimed by compare-and-swap on</text><text x="476" y="282" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >the commit SHA</text><rect x="884" y="130" width="270" height="170" rx="14" fill="#ffffff" stroke="#d9d6ee" stroke-width="1.5"/><rect x="884" y="130" width="8" height="170" rx="4" fill="#eb6834"/><text x="910" y="166" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start" >Orchestrator (stateless)</text><text x="910" y="194" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >a tick every 15 min on</text><text x="910" y="216" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >GitHub Actions: read state,</text><text x="910" y="238" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >dispatch if quota allows, exit</text><text x="910" y="260" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >schedule now disabled</text><line x1="346" y1="130" x2="450" y2="180" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#a2)"/><text x="358" y="112" font-size="13.5" fill="#52514e" font-weight="500" text-anchor="start" >push checkpoint, heartbeat</text><line x1="450" y1="250" x2="346" y2="300" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#a2)"/><text x="356" y="330" font-size="13.5" fill="#52514e" font-weight="500" text-anchor="start" >pull checkpoint, claim lease</text><line x1="884" y1="215" x2="780" y2="215" stroke="#7c5cff" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a2)"/><text x="790" y="205" font-size="13.5" fill="#52514e" font-weight="500" text-anchor="start" >reads state</text><text x="46" y="405" font-size="15" fill="#52514e" font-weight="500" text-anchor="start" >A crashed session just lets its lease expire; the next tick redispatches. No server, no shared state outside the Hub.</text></svg>