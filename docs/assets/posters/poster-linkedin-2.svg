<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d"><title id="t">Built end to end: bussin-125m</title><desc id="d">Six stages from a slang lexicon to a released model, each with one measured number</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs><rect width="1080" height="1350" fill="#EDF0F6"/><rect width="1080" height="368" fill="#0F1A35"/><g transform="translate(84,64) scale(0.2727272727272727)"><rect width="220" height="220" rx="50" fill="url(#g)"/><rect x="32" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="32" y="76.0" width="8" height="102.0" rx="4" fill="#fff" opacity=".9"/><circle cx="36" cy="76.0" r="15" fill="#fff"/><circle cx="36" cy="76.0" r="6" fill="#7c5cff"/><rect x="69" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="69" y="133.1" width="8" height="44.9" rx="4" fill="#fff" opacity=".9"/><circle cx="73" cy="133.1" r="15" fill="#fff"/><circle cx="73" cy="133.1" r="6" fill="#7c5cff"/><rect x="106" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="106" y="86.9" width="8" height="91.1" rx="4" fill="#fff" opacity=".9"/><circle cx="110" cy="86.9" r="15" fill="#fff"/><circle cx="110" cy="86.9" r="6" fill="#7c5cff"/><rect x="143" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="143" y="178.0" width="8" height="0.0" rx="4" fill="#fff" opacity=".9"/><circle cx="147" cy="178.0" r="15" fill="#fff"/><circle cx="147" cy="178.0" r="6" fill="#7c5cff"/><rect x="180" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="180" y="178.0" width="8" height="0.0" rx="4" fill="#fff" opacity=".9"/><circle cx="184" cy="178.0" r="15" fill="#fff"/><circle cx="184" cy="178.0" r="6" fill="#7c5cff"/></g><text x="164" y="105" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="start" font-stretch="semi-condensed">bussin-125m</text><text x="80" y="262" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="112" font-weight="700" fill="#FFFFFF" text-anchor="start" font-stretch="semi-condensed" letter-spacing="-2">Built end to end.</text><text x="84" y="316" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="400" fill="#AEB7D0" text-anchor="start">From a slang dictionary to a model anyone can load.</text><line x1="116" y1="458" x2="116" y2="1148" stroke="#5B43F5" stroke-width="3" stroke-linecap="round"/><circle cx="116" cy="458" r="19" fill="#5B43F5"/><text x="116" y="465" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="180" y="467" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed">Measure</text><text x="180" y="500" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">A dated slang lexicon and a rule-based annotator score</text><text x="180" y="530" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">each document on five dials. No human labels.</text><text x="996" y="470" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" fill="#0F1A35" text-anchor="end" font-stretch="semi-condensed" letter-spacing="-1">55,499</text><text x="996" y="498" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">terms in the lexicon</text><circle cx="116" cy="596" r="19" fill="#5B43F5"/><text x="116" y="603" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="180" y="605" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed">Train</text><text x="180" y="638" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">A 125.9M-parameter decoder trained on two free Kaggle</text><text x="180" y="668" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">GPUs, with a schedule built for an unknown quota.</text><text x="996" y="608" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" fill="#0F1A35" text-anchor="end" font-stretch="semi-condensed" letter-spacing="-1">7.8B</text><text x="996" y="636" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">training tokens</text><circle cx="116" cy="734" r="19" fill="#5B43F5"/><text x="116" y="741" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="180" y="743" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed">Relay</text><text x="180" y="776" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">A lease, claimed by compare-and-swap on a commit hash,</text><text x="180" y="806" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">hands training between sessions without forking.</text><text x="996" y="746" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" fill="#0F1A35" text-anchor="end" font-stretch="semi-condensed" letter-spacing="-1">0.0</text><text x="996" y="774" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">divergence when a run</text><text x="996" y="796" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">resumes</text><circle cx="116" cy="872" r="19" fill="#5B43F5"/><text x="116" y="879" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="180" y="881" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed">Verify</text><text x="180" y="914" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">Six behavioural test suites, including one that checks</text><text x="180" y="944" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">what the model actually learned.</text><text x="996" y="884" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" fill="#0F1A35" text-anchor="end" font-stretch="semi-condensed" letter-spacing="-1">6</text><text x="996" y="912" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">test suites</text><circle cx="116" cy="1010" r="19" fill="#5B43F5"/><text x="116" y="1017" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="180" y="1019" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed">Evaluate</text><text x="180" y="1052" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">A shuffled baseline and single-dial sweeps show whether</text><text x="180" y="1082" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">each dial really steers the output.</text><text x="996" y="1022" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" fill="#0F1A35" text-anchor="end" font-stretch="semi-condensed" letter-spacing="-1">2.88</text><text x="996" y="1050" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">measured when slang 3</text><text x="996" y="1072" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">is requested</text><circle cx="116" cy="1148" r="19" fill="#E8397D"/><text x="116" y="1155" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="180" y="1157" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed">Ship</text><text x="180" y="1190" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">Exported to Llama format and checked against the</text><text x="180" y="1220" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#56617F" text-anchor="start">original, so it loads in three lines of transformers.</text><text x="996" y="1160" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" fill="#E8397D" text-anchor="end" font-stretch="semi-condensed" letter-spacing="-1">3.6e-5</text><text x="996" y="1188" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">largest logit</text><text x="996" y="1210" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="end">difference</text><line x1="84" y1="1246" x2="996" y2="1246" stroke="#C9D0E0" stroke-width="2"/><text x="84" y="1282" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1A35" text-anchor="start">huggingface.co/Ravikishan/bussin-125m</text><text x="84" y="1312" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#56617F" text-anchor="start">github.com/Ravikisha/Bussin</text><text x="996" y="1282" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1A35" text-anchor="end">Ravi Kishan</text><text x="996" y="1312" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#56617F" text-anchor="end">ravikishan.me/blog</text></svg>