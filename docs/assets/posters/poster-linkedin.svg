<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d"><title id="t">Slang is a dial: bussin-125m</title><desc id="d">One message placed on a slang scale from 0 to 4, with the model's real outputs and the headline results</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs><rect width="1080" height="1350" fill="#EDF0F6"/><g transform="translate(84,64) scale(0.2727272727272727)"><rect width="220" height="220" rx="50" fill="url(#g)"/><rect x="32" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="32" y="76.0" width="8" height="102.0" rx="4" fill="#fff" opacity=".9"/><circle cx="36" cy="76.0" r="15" fill="#fff"/><circle cx="36" cy="76.0" r="6" fill="#7c5cff"/><rect x="69" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="69" y="133.1" width="8" height="44.9" rx="4" fill="#fff" opacity=".9"/><circle cx="73" cy="133.1" r="15" fill="#fff"/><circle cx="73" cy="133.1" r="6" fill="#7c5cff"/><rect x="106" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="106" y="86.9" width="8" height="91.1" rx="4" fill="#fff" opacity=".9"/><circle cx="110" cy="86.9" r="15" fill="#fff"/><circle cx="110" cy="86.9" r="6" fill="#7c5cff"/><rect x="143" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="143" y="178.0" width="8" height="0.0" rx="4" fill="#fff" opacity=".9"/><circle cx="147" cy="178.0" r="15" fill="#fff"/><circle cx="147" cy="178.0" r="6" fill="#7c5cff"/><rect x="180" y="42" width="8" height="136" rx="4" fill="#fff" opacity=".32"/><rect x="180" y="178.0" width="8" height="0.0" rx="4" fill="#fff" opacity=".9"/><circle cx="184" cy="178.0" r="15" fill="#fff"/><circle cx="184" cy="178.0" r="6" fill="#7c5cff"/></g><text x="164" y="105" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed" >bussin-125m</text><text x="78" y="272" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="140" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed" letter-spacing="-3" >Slang is</text><text x="78" y="408" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="140" font-weight="700" fill="#0F1A35" text-anchor="start" font-stretch="semi-condensed" letter-spacing="-3" >a dial.</text><text x="84" y="468" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" fill="#56617F" text-anchor="start" >A 125M-parameter language model, trained on free GPUs,</text><text x="84" y="504" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" fill="#56617F" text-anchor="start" >that writes in the register you ask for.</text><text x="84" y="566" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#56617F">One message, four registers: <tspan font-family="Georgia, Cambria, 'Times New Roman', serif" font-style="italic" font-weight="700" fill="#0F1A35" font-size="24">“thoughts on the new iphone”</tspan></text><line x1="130" y1="622" x2="130" y2="1042" stroke="#5B43F5" stroke-width="3" stroke-linecap="round"/><text x="130" y="608" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#56617F" text-anchor="middle" >slang</text><text x="108" y="647" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#56617F" text-anchor="end" >0</text><line x1="120" y1="640" x2="140" y2="640" stroke="#5B43F5" stroke-width="3" stroke-linecap="round"/><text x="108" y="743" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#56617F" text-anchor="end" >1</text><line x1="120" y1="736" x2="140" y2="736" stroke="#5B43F5" stroke-width="3" stroke-linecap="round"/><text x="108" y="839" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#56617F" text-anchor="end" >2</text><line x1="120" y1="832" x2="140" y2="832" stroke="#5B43F5" stroke-width="3" stroke-linecap="round"/><text x="108" y="935" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#56617F" text-anchor="end" >3</text><line x1="120" y1="928" x2="140" y2="928" stroke="#5B43F5" stroke-width="3" stroke-linecap="round"/><text x="108" y="1031" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#56617F" text-anchor="end" >4</text><line x1="120" y1="1024" x2="140" y2="1024" stroke="#5B43F5" stroke-width="3" stroke-linecap="round"/><circle cx="130" cy="640" r="9" fill="#0F1A35"/><text x="196" y="634" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#56617F" text-anchor="start" >slang 0, formal 3</text><text x="196" y="664" font-family="Georgia, Cambria, 'Times New Roman', serif,'Segoe UI Emoji'" font-size="27" font-weight="400" fill="#0F1A35" text-anchor="start" >...I was thinking of buying the new one, however I&#x27;m not quite</text><text x="196" y="697" font-family="Georgia, Cambria, 'Times New Roman', serif,'Segoe UI Emoji'" font-size="27" font-weight="400" fill="#0F1A35" text-anchor="start" >sure how to connect to the new phone.</text><circle cx="130" cy="736" r="9" fill="#0F1A35"/><text x="196" y="730" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#56617F" text-anchor="start" >slang 1, abbrev 1</text><text x="196" y="760" font-family="Georgia, Cambria, 'Times New Roman', serif,'Segoe UI Emoji'" font-size="27" font-weight="400" fill="#0F1A35" text-anchor="start" >also if you know anyone who uses airpods, pls share them</text><circle cx="130" cy="928" r="9" fill="#0F1A35"/><text x="196" y="922" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#56617F" text-anchor="start" >slang 3, emoji 1, abbrev 2</text><text x="196" y="952" font-family="Georgia, Cambria, 'Times New Roman', serif,'Segoe UI Emoji'" font-size="27" font-weight="400" fill="#0F1A35" text-anchor="start" >i don&#x27;t know what the phone is worth rn but it&#x27;s a nice</text><text x="196" y="985" font-family="Georgia, Cambria, 'Times New Roman', serif,'Segoe UI Emoji'" font-size="27" font-weight="400" fill="#0F1A35" text-anchor="start" >looking phone that i wanna use for a couple of hours ...</text><circle cx="130" cy="1024" r="17" fill="#E8397D"/><circle cx="130" cy="1024" r="6.5" fill="#EDF0F6"/><text x="196" y="1018" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#E8397D" text-anchor="start" >slang 4, emoji 2, abbrev 3, elong 1</text><text x="196" y="1048" font-family="Georgia, Cambria, 'Times New Roman', serif,'Segoe UI Emoji'" font-size="27" font-weight="400" fill="#0F1A35" text-anchor="start" >...lmk i wanna get a new iPhone idk if i should get the iphone</text><text x="196" y="1081" font-family="Georgia, Cambria, 'Times New Roman', serif,'Segoe UI Emoji'" font-size="27" font-weight="400" fill="#0F1A35" text-anchor="start" >12 or the 12 pro i wanna keep my 16 pro btw 🙏</text><rect x="0" y="1124" width="1080" height="226" fill="#0F1A35"/><text x="80" y="1210" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="700" fill="#FFFFFF" text-anchor="start" font-stretch="semi-condensed" letter-spacing="-1" >0.146</text><text x="280" y="1210" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="700" fill="#7F8BB0" text-anchor="start" font-stretch="semi-condensed" letter-spacing="-1" >vs 0.646</text><text x="84" y="1242" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#AEB7D0" text-anchor="start" >register error: the model against a shuffled-request baseline, 200 held-out requests</text><text x="996" y="1170" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="end" font-stretch="semi-condensed" >7.8B tokens</text><text x="996" y="1202" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#AEB7D0" text-anchor="end" >on free Kaggle GPUs</text><text x="996" y="1240" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="end" font-stretch="semi-condensed" >$0 spent</text><line x1="84" y1="1264" x2="996" y2="1264" stroke="#2B3859" stroke-width="2"/><text x="84" y="1302" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="start" >huggingface.co/Ravikishan/bussin-125m</text><text x="84" y="1330" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#AEB7D0" text-anchor="start" >github.com/Ravikisha/Bussin</text><text x="996" y="1302" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="end" >Ravi Kishan</text><text x="996" y="1330" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#AEB7D0" text-anchor="end" >ravikishan.me/blog</text></svg>